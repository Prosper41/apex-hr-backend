name: CI
on:
  pull_request:
    branches: [master, backend]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=src/infrastructure/database/prisma/schema.prisma
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
  e2e-and-integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: apex_test
          MARIADB_USER: apex
          MARIADB_PASSWORD: apex
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rabbitmq:
        image: rabbitmq:4.3.2-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: mysql://apex:apex@localhost:3306/apex_test
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: apex
      DB_PASSWORD: apex
      DB_DATABASE: apex_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_ACCESS_SECRET: ci-test-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USER: test
      MAIL_PASS: test
      MAIL_FROM: test@apexhr.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=src/infrastructure/database/prisma/schema.prisma
      - name: Push schema to database
        run: npx prisma db push --schema=src/infrastructure/database/prisma/schema.prisma --accept-data-loss --skip-generate
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e
      - name: Verify Docker image builds
        run: docker build -t api-ci -f Dockerfile .
